spring.application.name=process-builder
server.address=127.0.0.1
server.port=${PROCESS_PORT:8095}
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=WORKFLOW_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.tomcat.max-http-form-post-size=256KB
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${PROCESS_DB_URL:jdbc:h2:file:./data/processes;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${PROCESS_DB_USER:sa}
spring.datasource.password=${PROCESS_DB_PASSWORD:}
spring.sql.init.mode=always
spring.thymeleaf.cache=true
process.demo=${PROCESS_DEMO:false}
process.bootstrap=${PROCESS_BOOTSTRAP:true}
process.zone=${PROCESS_ZONE:Europe/Moscow}
